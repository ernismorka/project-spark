name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: spark-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm demo:package
      - run: pnpm test:release
      - run: ./scripts/check-windows-launcher.ps1
        shell: pwsh
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm doctor:project
      - run: xvfb-run -a pnpm verify
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SPARK_HEADED: "1"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: project-spark-0.8.0-demo.1
          path: dist/project-spark-0.8.0-demo.1/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
